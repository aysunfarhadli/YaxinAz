spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yaxinaz_db}
    username: ${DB_USERNAME:yaxinaz}
    password: ${DB_PASSWORD:yaxinaz}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  devtools:
    restart:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.yaxinaz: DEBUG
    org.springframework.security: INFO

management:
  endpoint:
    health:
      show-details: always
