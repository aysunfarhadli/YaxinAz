spring:
  datasource:
    url: jdbc:h2:mem:yaxinaz_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

yaxinaz:
  ai:
    enabled: false
    mock-fallback: true
  features:
    ai-enabled: false
    mock-ai-fallback-enabled: true
  storage:
    base-path: build/test-uploads

logging:
  level:
    com.yaxinaz: INFO
    org.springframework.security: WARN
