spring:
  application:
    name: YaxinAz
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:claude-sonnet-5}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

yaxinaz:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-change-me-please-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    issuer: yaxinaz.az
  ai:
    enabled: ${AI_ENABLED:true}
    mock-fallback: ${MOCK_AI_FALLBACK:true}
    model: ${AI_MODEL:claude-sonnet-5}
    timeout-ms: ${AI_TIMEOUT:15000}
  features:
    ai-enabled: ${AI_ENABLED:true}
    websocket-enabled: true
    natural-language-search-enabled: true
    mock-ai-fallback-enabled: ${MOCK_AI_FALLBACK:true}
    file-upload-enabled: true
  rate-limit:
    login-attempts-per-minute: 5
    ai-requests-per-minute: 10
    issue-creation-per-minute: 6
    announcement-rewrite-per-minute: 6
    moderation-report-per-minute: 10
  storage:
    base-path: ${FILE_STORAGE_PATH:./uploads}
    max-file-size-bytes: 5242880
    allowed-extensions: jpg,jpeg,png,webp
  escalation:
    critical-open-minutes-threshold: 30
    high-unresolved-hours-threshold: 48
    stale-issue-hours-threshold: 72
    check-interval-ms: 300000
