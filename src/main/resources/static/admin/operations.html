<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations Center - Yaxın.az</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/typography.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-shell"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/modal.js"></script>
  <script src="/js/ui/loading.js"></script>
  <script src="/js/ui/dropdown.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.4/stomp.min.js"></script>
  <script src="/js/websocket.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/app.js"></script>

  <script>
    auth.requireAuth();
    const pageEl = appShell.render({ activeNav: 'admin-operations' });

    pageEl.innerHTML = `
      <div class="page-header">
        <div><h1>${i18n.t('operationsCenter')}</h1><p>${i18n.t('operationsCenterSubtitle')}</p></div>
        <button class="btn btn-outline btn-sm" id="refresh-btn">${i18n.t('refresh')}</button>
      </div>
      <div id="ops-content">${loading.skeletonRows(4, 2)}</div>
    `;

    document.getElementById('refresh-btn').addEventListener('click', loadOperationsCenter);
    loadOperationsCenter();

    function statusDot(status) {
      const cls = status === 'ONLINE' || status === 'ACTIVE' || status === 'CLAUDE' ? 'online'
        : status === 'MOCK' ? 'mock' : 'offline';
      return `<span class="status-dot ${cls}"></span>`;
    }

    async function loadOperationsCenter() {
      const content = document.getElementById('ops-content');
      try {
        const [ops, reportsPage, auditPage] = await Promise.all([
          api.get('/admin/operations-center'),
          api.get('/admin/reports', { query: { size: 10 } }).catch(() => ({ content: [] })),
          api.get('/admin/audit-log', { query: { size: 15 } }).catch(() => ({ content: [] })),
        ]);

        content.innerHTML = `
          <div class="admin-stat-grid">
            <div class="stat-card"><span class="stat-label">${i18n.t('criticalIssuesLabel')}</span><span class="stat-value">${ops.criticalIssuesCount}</span></div>
            <div class="stat-card"><span class="stat-label">${i18n.t('staleIssuesLabel')}</span><span class="stat-value">${ops.staleIssuesCount}</span></div>
            <div class="stat-card"><span class="stat-label">${i18n.t('escalatedIssuesLabel')}</span><span class="stat-value">${ops.escalatedIssuesCount}</span></div>
            <div class="stat-card"><span class="stat-label">${i18n.t('moderationQueueLabel')}</span><span class="stat-value">${ops.moderationQueueCount}</span></div>
          </div>

          <div class="card" style="margin-top:20px">
            <h4 style="margin-bottom:12px">${i18n.t('systemHealth')}</h4>
            <div class="ops-status-grid">
              <div class="ops-status-item"><span class="label">${i18n.t('applicationLabel')}</span><span class="value">${statusDot(ops.systemHealth.applicationStatus)}${ops.systemHealth.applicationStatus}</span></div>
              <div class="ops-status-item"><span class="label">${i18n.t('databaseLabel')}</span><span class="value">${statusDot(ops.systemHealth.databaseStatus)}${ops.systemHealth.databaseStatus}</span></div>
              <div class="ops-status-item"><span class="label">${i18n.t('aiProviderLabel')}</span><span class="value">${statusDot(ops.systemHealth.aiProvider)}${ops.systemHealth.aiProvider}</span></div>
              <div class="ops-status-item"><span class="label">${i18n.t('webSocketLabel')}</span><span class="value">${statusDot(ops.systemHealth.webSocketStatus)}${ops.systemHealth.webSocketStatus}</span></div>
            </div>
            <p class="text-xs text-muted" style="margin-top:10px">${i18n.t('activeProfileLabel')}: ${ops.systemHealth.activeProfile} · ${i18n.t('lastChecked')}: ${new Date(ops.systemHealth.lastCheckedAt).toLocaleTimeString()}</p>
          </div>

          <div class="two-col" style="margin-top:20px">
            <div class="stack">
              <div class="card">
                <h4 style="margin-bottom:10px">${i18n.t('pendingMemberships')} (${ops.pendingMembershipsCount})</h4>
                <p class="text-sm text-muted">${i18n.t('reviewFromAdminDashboard')}</p>
              </div>
              <div class="card">
                <h4 style="margin-bottom:10px">${i18n.t('pendingProvidersLabel')} (${ops.pendingProvidersCount})</h4>
                <p class="text-sm text-muted">${i18n.t('reviewFromProviderWidget')}</p>
              </div>
              <div class="card">
                <h4 style="margin-bottom:10px">${i18n.t('moderationReportsLabel')}</h4>
                <div id="reports-list">
                  ${reportsPage.content.length ? reportsPage.content.map((r) => `
                    <div class="queue-item">
                      <div><strong class="text-sm">${i18n.enumLabel('ContentType', r.contentType)} #${r.contentId}</strong> · ${i18n.enumLabel('ReportReason', r.reason)}<br/><span class="text-xs text-muted">${r.description || ''}</span></div>
                      <div class="row">
                        <button class="btn btn-primary btn-sm" data-resolve="${r.id}" data-status="ACTION_TAKEN">${i18n.t('takeAction')}</button>
                        <button class="btn btn-ghost btn-sm" data-resolve="${r.id}" data-status="DISMISSED">${i18n.t('dismiss')}</button>
                      </div>
                    </div>`).join('') : `<p class="text-sm text-muted">${i18n.t('noPendingReports')}</p>`}
                </div>
              </div>
            </div>
            <div class="card">
              <h4 style="margin-bottom:10px">${i18n.t('recentAuditTrail')}</h4>
              ${auditPage.content.length ? auditPage.content.map((a) => `
                <div class="audit-row">
                  <span class="time">${new Date(a.createdAt).toLocaleString()}</span>
                  <span>${a.actionType.replace(/_/g,' ')} ${a.resourceType ? '· ' + a.resourceType + (a.resourceId ? ' #' + a.resourceId : '') : ''}</span>
                </div>`).join('') : `<p class="text-sm text-muted">${i18n.t('noAuditEntriesYet')}</p>`}
            </div>
          </div>
        `;

        document.querySelectorAll('[data-resolve]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            try {
              await api.patch(`/admin/reports/${btn.dataset.resolve}/status`, { status: btn.dataset.status });
              toast.success(i18n.t('reportUpdated'));
              loadOperationsCenter();
            } catch (e) { toast.error(e.message); }
          });
        });
      } catch (e) {
        if (e.status === 403) {
          loading.emptyState(content, { icon: '🔒', title: i18n.t('platformAdminAccessRequired'), message: i18n.t('operationsCenterPlatformOnly') });
        } else {
          loading.emptyState(content, { icon: '🚫', title: i18n.t('unableToLoadOperationsCenter'), message: e.message });
        }
      }
    }
  </script>
</body>
</html>
