<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications - Yaxın.az</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/typography.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-shell"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/loading.js"></script>
  <script src="/js/ui/dropdown.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.4/stomp.min.js"></script>
  <script src="/js/websocket.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/app.js"></script>

  <script>
    auth.requireAuth();
    const pageEl = appShell.render({ activeNav: 'notifications' });

    pageEl.innerHTML = `
      <div class="page-header">
        <div><h1 data-i18n="notifications">${i18n.t('notifications')}</h1><p>${i18n.t('notificationsSubtitle')}</p></div>
        <button class="btn btn-outline btn-sm" id="mark-all-btn">${i18n.t('markAllRead')}</button>
      </div>
      <div id="notif-list" class="stack"></div>
      <div class="row" style="justify-content:center;margin-top:16px" id="pagination"></div>
    `;

    let currentPage = 0;

    function timeAgo(iso) {
      const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (seconds < 60) return i18n.t('justNow');
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return i18n.t('minutesAgo', { n: minutes });
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return i18n.t('hoursAgo', { n: hours });
      return i18n.t('daysAgo', { n: Math.floor(hours / 24) });
    }

    async function loadNotifications() {
      const el = document.getElementById('notif-list');
      el.innerHTML = loading.skeletonRows(4, 2);
      try {
        const page = await api.get('/notifications', { query: { page: currentPage, size: 15 } });
        if (!page.content.length) {
          loading.emptyState(el, { icon: '🔔', title: i18n.t('noNotificationsTitle'), message: i18n.t('allCaughtUp') });
        } else {
          el.innerHTML = page.content.map((n) => `
            <div class="card card-compact" data-id="${n.id}" style="${n.read ? '' : 'border-left:3px solid var(--color-primary)'}">
              <div class="row-between">
                <strong class="text-sm">${n.title}</strong>
                <span class="text-xs text-muted">${timeAgo(n.createdAt)}</span>
              </div>
              <p class="text-sm text-secondary">${n.message}</p>
              ${!n.read ? `<button class="btn btn-ghost btn-sm mark-read-btn">${i18n.t('markAsRead')}</button>` : ''}
            </div>`).join('');
          document.querySelectorAll('.mark-read-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const id = btn.closest('[data-id]').dataset.id;
              await api.patch(`/notifications/${id}/read`);
              loadNotifications();
              notifications.refreshUnreadCount();
            });
          });
        }
        renderPagination(page);
      } catch (e) { toast.error(i18n.t('unableToLoadNotifications') + e.message); }
    }

    function renderPagination(page) {
      const el = document.getElementById('pagination');
      if (page.totalPages <= 1) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <button class="btn btn-outline btn-sm" ${page.first ? 'disabled' : ''} id="prev-page">← ${i18n.t('prevPage')}</button>
        <span class="text-sm text-muted" style="margin:0 12px">${i18n.t('pageOf', { current: page.page + 1, total: page.totalPages })}</span>
        <button class="btn btn-outline btn-sm" ${page.last ? 'disabled' : ''} id="next-page">${i18n.t('nextPage')} →</button>`;
      document.getElementById('prev-page')?.addEventListener('click', () => { currentPage--; loadNotifications(); });
      document.getElementById('next-page')?.addEventListener('click', () => { currentPage++; loadNotifications(); });
    }

    document.getElementById('mark-all-btn').addEventListener('click', async () => {
      await api.patch('/notifications/read-all');
      toast.success(i18n.t('allNotificationsMarkedRead'));
      loadNotifications();
      notifications.refreshUnreadCount();
    });

    loadNotifications();
  </script>
</body>
</html>
